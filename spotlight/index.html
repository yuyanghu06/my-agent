<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotlight</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="tab-bar" class="tab-bar hidden"></div>
      <div class="bar" data-tauri-drag-region>
        <div class="bar-icon" aria-hidden="true">
          <svg viewBox="0 0 18 18" width="18" height="18">
            <circle cx="9" cy="9" r="8" fill="none" stroke="currentColor" stroke-width="2"/>
          </svg>
        </div>
        <div class="bar-actions">
          <button
            id="actions-btn"
            class="bar-btn actions-trigger"
            type="button"
            title="Actions"
            aria-label="Actions"
            aria-haspopup="menu"
            aria-expanded="false"
          >
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <circle cx="3" cy="8" r="1.5" fill="currentColor"/>
              <circle cx="8" cy="8" r="1.5" fill="currentColor"/>
              <circle cx="13" cy="8" r="1.5" fill="currentColor"/>
            </svg>
            <span id="actions-badge" class="kebab-badge"></span>
          </button>
        </div>
        <div id="composer-wrap" class="composer-wrap">
          <div id="reply-quote-chip" class="reply-quote-chip hidden"></div>
          <div id="attachments" class="attachments hidden"></div>
          <textarea
            id="composer"
            placeholder="Ask anything…"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            rows="1"
            autofocus
          ></textarea>
        </div>
      </div>
      <div id="commands" class="commands hidden"></div>
      <div id="actions-menu" class="actions-menu hidden" role="menu" aria-label="Actions">
        <button id="autoshot-btn" class="actions-row" type="button" role="menuitem" aria-pressed="false" title="Auto-attach screenshot on submit">
          <span class="actions-ico">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <path fill="currentColor" d="M5 3l1-1.5h4L11 3h3a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h3zm3 8.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zm0-1.4a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6z"/>
            </svg>
          </span>
          <span class="actions-lbl">Auto-screenshot</span>
        </button>
        <button id="record-btn" class="actions-row" type="button" role="menuitem" aria-pressed="false" title="Record screen clip">
          <span class="actions-ico">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <circle cx="8" cy="8" r="5" fill="currentColor"/>
            </svg>
          </span>
          <span class="actions-lbl">Record</span>
        </button>
        <button id="pin-btn" class="actions-row" type="button" role="menuitem" aria-pressed="false" title="Keep window on top">
          <span class="actions-ico">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <path fill="currentColor" d="M9.5 1.5a1 1 0 0 0-1.7-.7L5.6 3 3.2 3.6a1 1 0 0 0-.5 1.7L6 8.6l-3 4.4 4.4-3 3.3 3.3a1 1 0 0 0 1.7-.5L12 10.4l2.2-2.2a1 1 0 0 0-.7-1.7l-2.5-.1z"/>
            </svg>
          </span>
          <span class="actions-lbl">Pin window</span>
        </button>
        <button id="sessions-btn" class="actions-row" type="button" role="menuitem" title="Sessions">
          <span class="actions-ico">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <rect x="2" y="2.5" width="9" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.4"/>
              <path fill="currentColor" d="M5 12.2c0 .7.6 1.3 1.3 1.3H12a2 2 0 0 0 2-2V6.5a1.3 1.3 0 0 0-1.3-1.3v6A1 1 0 0 1 11.7 12H5z"/>
            </svg>
          </span>
          <span class="actions-lbl">Sessions</span>
          <span id="sessions-badge" class="row-badge"></span>
        </button>
        <button id="settings-btn" class="actions-row" type="button" role="menuitem" title="Settings">
          <span class="actions-ico">
            <svg viewBox="0 0 16 16" width="15" height="15" aria-hidden="true">
              <path fill="currentColor" d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zm6.4 3.2l1.3 1a.5.5 0 0 1 .1.6l-1.3 2.2a.5.5 0 0 1-.6.2l-1.6-.5a5.5 5.5 0 0 1-1.3.7l-.2 1.6a.5.5 0 0 1-.5.5h-2.6a.5.5 0 0 1-.5-.5l-.2-1.6a5.5 5.5 0 0 1-1.3-.7l-1.6.5a.5.5 0 0 1-.6-.2L1.2 10.3a.5.5 0 0 1 .1-.6l1.3-1a5.5 5.5 0 0 1 0-1.4l-1.3-1a.5.5 0 0 1-.1-.6l1.3-2.2a.5.5 0 0 1 .6-.2l1.6.5a5.5 5.5 0 0 1 1.3-.7l.2-1.6a.5.5 0 0 1 .5-.5h2.6a.5.5 0 0 1 .5.5l.2 1.6a5.5 5.5 0 0 1 1.3.7l1.6-.5a.5.5 0 0 1 .6.2l1.3 2.2a.5.5 0 0 1-.1.6l-1.3 1a5.5 5.5 0 0 1 0 1.4z"/>
            </svg>
          </span>
          <span class="actions-lbl">Settings</span>
        </button>
      </div>
      <div id="status" class="status-line"></div>
      <div id="response" class="response empty">
        <div id="response-inner" class="response-inner"></div>
      </div>
      <div id="settings-panel" class="settings-panel hidden">
        <div class="settings-header">Settings</div>
        <div class="settings-section">
          <div class="settings-section-title">Hotkeys</div>
          <div class="settings-row" data-hotkey="togglePin">
            <label>Toggle pin (always-on-top)</label>
            <input type="text" class="hotkey-input" readonly placeholder="Click and press keys" />
            <button class="hotkey-clear" type="button" title="Clear">×</button>
          </div>
          <div class="settings-row" data-hotkey="toggleRecording">
            <label>Toggle screen recording</label>
            <input type="text" class="hotkey-input" readonly placeholder="Click and press keys" />
            <button class="hotkey-clear" type="button" title="Clear">×</button>
          </div>
          <div class="settings-row" data-hotkey="toggleAutoScreenshot">
            <label>Toggle auto-screenshot</label>
            <input type="text" class="hotkey-input" readonly placeholder="Click and press keys" />
            <button class="hotkey-clear" type="button" title="Clear">×</button>
          </div>
          <div class="settings-row" data-hotkey="snapScreenshot">
            <label>Take screenshot now</label>
            <input type="text" class="hotkey-input" readonly placeholder="Click and press keys" />
            <button class="hotkey-clear" type="button" title="Clear">×</button>
          </div>
          <div class="settings-hint">Click a field, hold modifiers (⌘ ⌥ ⌃ ⇧) and press a key. Esc to cancel.</div>
        </div>

        <div class="settings-section net-section">
          <div class="net-head">
            <div class="settings-section-title">Host</div>
            <label class="net-toggle">
              <input type="checkbox" id="host-toggle" />
              <span class="net-toggle-track"><span class="net-toggle-thumb"></span></span>
              <span class="net-toggle-label">Off</span>
            </label>
          </div>
          <div class="net-hint">Accept incoming queries from other devices on your Tailscale network.</div>
          <div class="settings-row">
            <label>Port</label>
            <input id="host-port" type="number" class="net-input net-input-short" min="1024" max="65535" value="47330" />
          </div>
          <div class="settings-row">
            <label>Auth token</label>
            <input id="host-token" type="text" class="net-input net-input-mono" placeholder="auto-generated" />
            <button id="host-token-regen" class="net-btn" type="button" title="Regenerate">↻</button>
            <button id="host-token-copy" class="net-btn" type="button" title="Copy token">⎘</button>
          </div>
          <div class="settings-row net-share-row hidden" id="host-share-row">
            <label>Share URL</label>
            <input id="host-share-url" type="text" class="net-input net-input-mono" readonly />
            <button id="host-share-copy" class="net-btn" type="button" title="Copy URL">⎘</button>
          </div>
          <div class="net-status" id="host-status">Stopped</div>
        </div>

        <div class="settings-section net-section">
          <div class="net-head">
            <div class="settings-section-title">Client</div>
            <label class="net-toggle">
              <input type="checkbox" id="client-toggle" />
              <span class="net-toggle-track"><span class="net-toggle-thumb"></span></span>
              <span class="net-toggle-label">Off</span>
            </label>
          </div>
          <div class="net-hint">Route queries to a remote spotlight host instead of the local daemon.</div>
          <div class="settings-row">
            <label>Host</label>
            <input id="client-host" type="text" class="net-input net-input-mono" placeholder="hostname or IP (e.g. mac-mini.tail-abc.ts.net)" />
          </div>
          <div class="settings-row">
            <label>Port</label>
            <input id="client-port" type="number" class="net-input net-input-short" min="1024" max="65535" value="47330" />
          </div>
          <div class="settings-row">
            <label>Auth token</label>
            <input id="client-token" type="text" class="net-input net-input-mono" placeholder="paste host's token" />
            <button id="client-token-paste" class="net-btn" type="button" title="Paste share URL">⇩</button>
          </div>
          <div class="net-status" id="client-status">Local</div>
        </div>

        <div class="settings-footer">
          <button id="settings-close" type="button">Close</button>
        </div>
      </div>
    </div>
    <div id="sel-popover" class="sel-popover hidden">
      <button data-mode="inject" title="Reply in main thread">↩ Reply</button>
      <button data-mode="side" title="Open side chat">⊕ Side</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
