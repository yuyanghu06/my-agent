<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Spotlight</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div class="bar" data-tauri-drag-region>
        <div class="bar-icon" aria-hidden="true">
          <svg viewBox="0 0 24 24" width="20" height="20">
            <circle cx="10.5" cy="10.5" r="6.5" fill="none" stroke="currentColor" stroke-width="1.8"/>
            <line x1="15.5" y1="15.5" x2="20" y2="20" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
          </svg>
        </div>
        <div class="bar-actions">
          <button
            id="autoshot-btn"
            class="bar-btn"
            type="button"
            title="Auto-attach screenshot on submit"
            aria-label="Auto-attach screenshot on submit"
            aria-pressed="false"
          >
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path fill="currentColor" d="M5 3l1-1.5h4L11 3h3a1 1 0 0 1 1 1v8a1 1 0 0 1-1 1H2a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1h3zm3 8.2a3.2 3.2 0 1 0 0-6.4 3.2 3.2 0 0 0 0 6.4zm0-1.4a1.8 1.8 0 1 1 0-3.6 1.8 1.8 0 0 1 0 3.6z"/>
            </svg>
          </button>
          <button
            id="record-btn"
            class="bar-btn"
            type="button"
            title="Record screen clip"
            aria-label="Record screen clip"
            aria-pressed="false"
          >
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <circle cx="8" cy="8" r="5" fill="currentColor"/>
            </svg>
          </button>
          <button
            id="pin-btn"
            class="bar-btn"
            type="button"
            title="Keep window on top"
            aria-label="Keep window on top"
            aria-pressed="false"
          >
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path fill="currentColor" d="M9.5 1.5a1 1 0 0 0-1.7-.7L5.6 3 3.2 3.6a1 1 0 0 0-.5 1.7L6 8.6l-3 4.4 4.4-3 3.3 3.3a1 1 0 0 0 1.7-.5L12 10.4l2.2-2.2a1 1 0 0 0-.7-1.7l-2.5-.1z"/>
            </svg>
          </button>
          <button
            id="settings-btn"
            class="bar-btn"
            type="button"
            title="Settings"
            aria-label="Settings"
          >
            <svg viewBox="0 0 16 16" width="14" height="14" aria-hidden="true">
              <path fill="currentColor" d="M8 5.5a2.5 2.5 0 1 0 0 5 2.5 2.5 0 0 0 0-5zm6.4 3.2l1.3 1a.5.5 0 0 1 .1.6l-1.3 2.2a.5.5 0 0 1-.6.2l-1.6-.5a5.5 5.5 0 0 1-1.3.7l-.2 1.6a.5.5 0 0 1-.5.5h-2.6a.5.5 0 0 1-.5-.5l-.2-1.6a5.5 5.5 0 0 1-1.3-.7l-1.6.5a.5.5 0 0 1-.6-.2L1.2 10.3a.5.5 0 0 1 .1-.6l1.3-1a5.5 5.5 0 0 1 0-1.4l-1.3-1a.5.5 0 0 1-.1-.6l1.3-2.2a.5.5 0 0 1 .6-.2l1.6.5a5.5 5.5 0 0 1 1.3-.7l.2-1.6a.5.5 0 0 1 .5-.5h2.6a.5.5 0 0 1 .5.5l.2 1.6a5.5 5.5 0 0 1 1.3.7l1.6-.5a.5.5 0 0 1 .6.2l1.3 2.2a.5.5 0 0 1-.1.6l-1.3 1a5.5 5.5 0 0 1 0 1.4z"/>
            </svg>
          </button>
        </div>
        <div id="composer-wrap" class="composer-wrap">
          <div id="reply-quote-chip" class="reply-quote-chip hidden"></div>
          <div id="attachments" class="attachments hidden"></div>
          <textarea
            id="composer"
            placeholder="Ask Claude…"
            autocomplete="off"
            autocapitalize="off"
            spellcheck="false"
            rows="1"
            autofocus
          ></textarea>
        </div>
      </div>
      <div id="commands" class="commands hidden"></div>
      <div id="status" class="status-line"></div>
      <div id="response" class="response empty">
        <div id="response-inner" class="response-inner"></div>
      </div>
      <div id="settings-panel" class="settings-panel hidden">
        <div class="settings-header">Settings</div>
        <div class="settings-section">
          <div class="settings-section-title">Hotkeys</div>
          <div class="settings-row" data-hotkey="togglePin">
            <label>Toggle pin (always-on-top)</label>
            <input type="text" class="hotkey-input" readonly placeholder="Click and press keys" />
            <button class="hotkey-clear" type="button" title="Clear">×</button>
          </div>
          <div class="settings-row" data-hotkey="toggleRecording">
            <label>Toggle screen recording</label>
            <input type="text" class="hotkey-input" readonly placeholder="Click and press keys" />
            <button class="hotkey-clear" type="button" title="Clear">×</button>
          </div>
          <div class="settings-row" data-hotkey="toggleAutoScreenshot">
            <label>Toggle auto-screenshot</label>
            <input type="text" class="hotkey-input" readonly placeholder="Click and press keys" />
            <button class="hotkey-clear" type="button" title="Clear">×</button>
          </div>
          <div class="settings-row" data-hotkey="snapScreenshot">
            <label>Take screenshot now</label>
            <input type="text" class="hotkey-input" readonly placeholder="Click and press keys" />
            <button class="hotkey-clear" type="button" title="Clear">×</button>
          </div>
          <div class="settings-hint">Click a field, hold modifiers (⌘ ⌥ ⌃ ⇧) and press a key. Esc to cancel.</div>
        </div>
        <div class="settings-footer">
          <button id="settings-close" type="button">Close</button>
        </div>
      </div>
    </div>
    <div id="sel-popover" class="sel-popover hidden">
      <button data-mode="inject" title="Reply in main thread">↩ Reply</button>
      <button data-mode="side" title="Open side chat">⊕ Side</button>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
